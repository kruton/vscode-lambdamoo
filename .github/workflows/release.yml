name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify package lock and release tag
        shell: bash
        run: |
          package_version="$(jq --raw-output '.version' package.json)"
          lock_version="$(jq --raw-output '.version' package-lock.json)"
          lock_package_version="$(jq --raw-output '.packages[""].version' package-lock.json)"

          if [[ -z "${package_version}" || "${package_version}" == "null" ]]; then
            echo "Could not determine the extension version from package.json" >&2
            exit 1
          fi

          if [[ "${lock_version}" != "${package_version}" ]]; then
            echo "package-lock.json version ${lock_version:-<missing>} does not match package.json version ${package_version}; run npm install to update package-lock.json" >&2
            exit 1
          fi

          if [[ "${lock_package_version}" != "${package_version}" ]]; then
            echo "package-lock.json root package version ${lock_package_version:-<missing>} does not match package.json version ${package_version}; run npm install to update package-lock.json" >&2
            exit 1
          fi

          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}; expected ${expected_tag}" >&2
            exit 1
          fi

  package:
    name: Package extension
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile && npm run package:web

      - name: Package VSIX
        run: |
          mkdir -p dist
          npm exec -- vsce package \
            --no-dependencies \
            --out "dist/vscode-lambdamoo-${GITHUB_REF_NAME}.vsix"

      - name: Attest VSIX
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: dist

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.vsix > SHA256SUMS

      - name: Attest checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes

  marketplace:
    name: Publish Visual Studio Marketplace packages
    needs:
      - package
      - github-release
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: dist

      - name: Sign in to Azure with workload identity federation
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true

      - name: Show Marketplace identity ID
        run: |
          marketplace_identity_id="$(az rest \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id \
            --output tsv)"
          echo "Marketplace identity ID: ${marketplace_identity_id}"

      - name: Publish extension
        run: npm exec -- vsce publish --azure-credential --packagePath dist/*.vsix

  open-vsx:
    name: Publish Open VSX packages
    needs:
      - package
      - github-release
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: dist

      - name: Publish extension
        env:
          OPEN_VSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
        run: npm exec -- ovsx --pat "${OPEN_VSX_PAT}" publish --packagePath dist/*.vsix
