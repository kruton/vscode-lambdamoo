name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  MOO_LSP_REPOSITORY: kruton/moo-lsp-rs
  # renovate: datasource=github-releases depName=kruton/moo-lsp-rs
  MOO_LSP_VERSION: v0.2.2

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            archive: moo-lsp-rs-linux-x64.tar.gz
            executable: moo-lsp-rs
          - target: linux-arm64
            archive: moo-lsp-rs-linux-arm64.tar.gz
            executable: moo-lsp-rs
          - target: linux-armhf
            archive: moo-lsp-rs-linux-armhf.tar.gz
            executable: moo-lsp-rs
          - target: alpine-x64
            archive: moo-lsp-rs-alpine-x64.tar.gz
            executable: moo-lsp-rs
          - target: alpine-arm64
            archive: moo-lsp-rs-alpine-arm64.tar.gz
            executable: moo-lsp-rs
          - target: darwin-x64
            archive: moo-lsp-rs-darwin-x64.tar.gz
            executable: moo-lsp-rs
          - target: darwin-arm64
            archive: moo-lsp-rs-darwin-arm64.tar.gz
            executable: moo-lsp-rs
          - target: win32-x64
            archive: moo-lsp-rs-win32-x64.zip
            executable: moo-lsp-rs.exe
          - target: win32-arm64
            archive: moo-lsp-rs-win32-arm64.zip
            executable: moo-lsp-rs.exe
          - target: web
            archive: moo-lsp-rs-web.tar.gz
            executable: moo-lsp-rs.wasm

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Require tag to match extension version
        run: |
          package_version="$(npm pkg get version | tr -d '\"')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: npm ci

      - name: Download server and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/moo-lsp-release"
          gh release download "${MOO_LSP_VERSION}" \
            --repo "${MOO_LSP_REPOSITORY}" \
            --pattern "${{ matrix.archive }}" \
            --pattern SHA256SUMS \
            --dir "${RUNNER_TEMP}/moo-lsp-release"

      - name: Verify server checksum and build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/moo-lsp-release
        run: |
          grep "  ${{ matrix.archive }}$" SHA256SUMS | sha256sum --check --strict -
          gh attestation verify "${{ matrix.archive }}" --repo "${MOO_LSP_REPOSITORY}"

      - name: Install server binary
        run: |
          mkdir -p bin "${RUNNER_TEMP}/moo-lsp-extracted"
          case "${{ matrix.archive }}" in
            *.zip)
              unzip -q "${RUNNER_TEMP}/moo-lsp-release/${{ matrix.archive }}" \
                -d "${RUNNER_TEMP}/moo-lsp-extracted"
              ;;
            *)
              tar -xzf "${RUNNER_TEMP}/moo-lsp-release/${{ matrix.archive }}" \
                -C "${RUNNER_TEMP}/moo-lsp-extracted"
              ;;
          esac
          install -m 0755 \
            "${RUNNER_TEMP}/moo-lsp-extracted/${{ matrix.target }}/${{ matrix.executable }}" \
            "bin/${{ matrix.executable }}"

      - name: Compile extension
        run: npm run compile && npm run package:web

      - name: Package platform VSIX
        run: |
          mkdir -p dist
          npm exec -- vsce package \
            --no-dependencies \
            --target "${{ matrix.target }}" \
            --out "dist/vscode-lambdamoo-${GITHUB_REF_NAME}-${{ matrix.target }}.vsix"

      - name: Attest packaged server binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bin/${{ matrix.executable }}

      - name: Attest VSIX
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-${{ matrix.target }}
          path: dist/*.vsix
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download VSIX packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.vsix > SHA256SUMS

      - name: Attest checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes

  marketplace:
    name: Publish Visual Studio Marketplace packages
    needs:
      - package
      - github-release
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true

      - name: Sign in to Azure with workload identity federation
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true

      - name: Show Marketplace identity ID
        run: |
          marketplace_identity_id="$(az rest \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id \
            --output tsv)"
          echo "Marketplace identity ID: ${marketplace_identity_id}"

      - name: Publish platform packages
        run: npm exec -- vsce publish --azure-credential --packagePath dist/*.vsix

  open-vsx:
    name: Publish Open VSX packages
    needs:
      - package
      - github-release
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true

      - name: Publish platform packages
        env:
          OPEN_VSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
        run: npm exec -- ovsx --pat "${OPEN_VSX_PAT}" publish --packagePath dist/*.vsix
